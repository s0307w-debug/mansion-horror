<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>洋館の怪異</title><style>html,body{margin:0;overflow:hidden;background:#080808;color:white;font-family:sans-serif;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none}#info{position:absolute;top:15px;left:15px;text-shadow:0 2px 4px black}#stick{position:absolute;bottom:35px;left:30px;width:120px;height:120px;border:2px solid #ffffff66;border-radius:50%;pointer-events:auto;background:#ffffff12}#nub{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#ffffff99}#flash{position:absolute;right:24px;bottom:45px;padding:18px;border-radius:40px;background:#ffffff33;border:1px solid white;pointer-events:auto}#start{position:absolute;inset:0;background:#08080bed;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;pointer-events:auto}button{font-size:19px;padding:14px 30px;border:0;border-radius:12px}#message{position:absolute;top:42%;width:100%;text-align:center;font-size:24px;color:#f66;text-shadow:0 2px 5px black}#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:.5}</style></head><body><div id="hud"><div id="info">洋館の怪異　｜　廊下を探索しよう</div><div id="cross">＋</div><div id="message"></div><div id="stick"><div id="nub"></div></div><div id="flash">🔦</div><div id="start"><h1>洋館の怪異</h1><p>誰もいないはずの洋館。<br>廊下の奥で、何かが待っている。</p><button id="play">探索を始める</button><p style="font-size:13px">左下で移動・右側をなぞって視点変更<br>懐中電灯ボタンで点灯切替</p></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x090a0e);scene.fog=new THREE.FogExp2(0x090a0e,.035);const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.08,90);camera.position.set(0,1.65,8);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);scene.add(new THREE.AmbientLight(0x30364a,.22));const lamp=new THREE.PointLight(0xffbd70,6,12);lamp.position.set(0,3.5,2);scene.add(lamp);const flashlight=new THREE.SpotLight(0xe0eaff,12,26,Math.PI/7,.5,1);flashlight.position.set(0,0,0);camera.add(flashlight);flashlight.target.position.set(0,0,-8);camera.add(flashlight.target);scene.add(camera);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.9});const wall=mat(0x34303a),floor=mat(0x29201c),trim=mat(0x584338),red=mat(0x4b171c);function block(x,y,z,w,h,d,m){const a=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);a.position.set(x,y,z);a.receiveShadow=true;scene.add(a);return a}block(0,-.12,-12,12,.2,52,floor);block(0,5,-12,12,.25,52,wall);for(const x of [-6,6]){block(x,2.5,-12,.3,5,52,wall);for(let z=-36;z<14;z+=5){block(x-Math.sign(x)*.2,1.3,z,.12,2.6,.15,trim);block(x-Math.sign(x)*.15,3.7,z,.15,.18,3,trim)}}for(let z=-34;z<12;z+=8){block(0,.012,z,3,.025,5,red);const light=new THREE.PointLight(0xff9e58,2,7);light.position.set(0,3.8,z);scene.add(light)}block(0,2.5,-38,12,5,.3,wall);for(let z=-30;z<10;z+=9){for(const x of [-5.75,5.75]){block(x,1.7,z,.12,3,2.2,trim);block(x-Math.sign(x)*.08,1.65,z,.08,2.5,1.8,mat(0x141014))}}const glassMat=new THREE.MeshStandardMaterial({color:0x7599ac,transparent:true,opacity:.38,metalness:.4,roughness:.1,side:THREE.DoubleSide});const pane=block(0,2.3,-21,5,3,.07,glassMat);block(0,3.9,-21,5.4,.25,.3,trim);block(-2.6,2.3,-21,.25,3.3,.3,trim);block(2.6,2.3,-21,.25,3.3,.3,trim);
const enemy=new THREE.Group();const body=new THREE.Mesh(new THREE.CylinderGeometry(.3,.55,2.1,8),mat(0x18171a));body.position.y=1.05;enemy.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.37,12,10),mat(0x9c9a87));head.position.y=2.3;enemy.add(head);for(const x of [-.14,.14]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.055,8,8),new THREE.MeshBasicMaterial({color:0xff1717}));eye.position.set(x,2.34,-.33);enemy.add(eye)}enemy.position.set(0,0,-25);enemy.visible=false;scene.add(enemy);let active=false,trigger=false,alive=true,flashOn=true,yaw=0,pitch=0,moveX=0,moveY=0,last=performance.now();const msg=document.getElementById('message');function notice(t){msg.textContent=t;setTimeout(()=>{if(msg.textContent===t)msg.textContent=''},2400)}document.getElementById('play').onclick=()=>{document.getElementById('start').style.display='none';active=true};document.getElementById('flash').onclick=()=>{flashOn=!flashOn;flashlight.visible=flashOn};const stick=document.getElementById('stick'),nub=document.getElementById('nub');let sid=null;stick.addEventListener('pointerdown',e=>{sid=e.pointerId;stick.setPointerCapture(sid);stickMove(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===sid)stickMove(e)});function stickMove(e){const r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,len=Math.max(1,Math.hypot(dx,dy)),s=Math.min(1,len/48);moveX=dx/len*s;moveY=dy/len*s;nub.style.transform=`translate(${moveX*38}px,${moveY*38}px)`}function reset(){sid=null;moveX=moveY=0;nub.style.transform=''}stick.addEventListener('pointerup',reset);stick.addEventListener('pointercancel',reset);let look=null,lx=0,ly=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX<innerWidth*.27&&e.clientY>innerHeight*.7)return;look=e.pointerId;lx=e.clientX;ly=e.clientY;renderer.domElement.setPointerCapture(look)});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==look)return;yaw-=(e.clientX-lx)*.004;pitch=Math.max(-1.15,Math.min(1.15,pitch-(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY});renderer.domElement.addEventListener('pointerup',()=>look=null);function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;if(active&&alive){const speed=3.2;camera.position.x+= (Math.cos(yaw)*moveX+Math.sin(yaw)*moveY)*speed*dt;camera.position.z+=(Math.sin(yaw)*moveX-Math.cos(yaw)*moveY)*speed*dt;camera.position.x=Math.max(-5.3,Math.min(5.3,camera.position.x));camera.position.z=Math.max(-36,Math.min(12,camera.position.z));camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;if(!trigger&&camera.position.z<-15){trigger=true;pane.visible=false;enemy.visible=true;notice('ガシャーン！！');setTimeout(()=>notice('逃げろ！'),1000)}if(trigger){const delta=new THREE.Vector3(camera.position.x-enemy.position.x,0,camera.position.z-enemy.position.z);const distance=delta.length();if(distance>.05)enemy.position.addScaledVector(delta.normalize(),dt*1.65);enemy.lookAt(camera.position.x,0,camera.position.z);if(distance<.9){alive=false;msg.textContent='捕まった…';setTimeout(()=>location.reload(),2600)}}}renderer.render(scene,camera)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
